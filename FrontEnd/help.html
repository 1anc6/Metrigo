<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide split">
  <header class="page-head">
    <a class="back" href="profile.html" aria-label="Back"><span data-icon="arrowL"></span></a>
    <h1 class="title">Help &amp; Support</h1>
  </header>

  <div class="col">
  <form class="search" id="faqSearch" role="search">
    <input id="q" placeholder="Search…" aria-label="Search questions">
    <button aria-label="Search"><span data-icon="search"></span></button>
  </form>

  <section class="stack" id="faqs" style="gap:10px"></section>

  </div>
  <div class="col sticky" style="gap:12px">
  <div class="section-label desk-hide"><span class="h3">Get in touch</span></div>
  <div class="notice"><span data-icon="info"></span><span>MetriGo is a student demo run by one developer, not DMRC. For real Delhi Metro help, contact DMRC.</span></div>
  <a class="list-row" href="https://github.com/1anc6/Metrigo/issues" rel="noopener"><span data-icon="message"></span><span class="grow">Report a problem<span class="sub">Public issue on GitHub</span></span><span data-icon="arrowR" class="go"></span></a>

  <form class="card pad stack" id="contact" novalidate>
    <div class="h2">Send a message</div>
    <select class="input" id="topic" aria-label="Topic" style="box-shadow:none;background:var(--card-2)">
      <option>Booking issue</option><option>Payment problem</option><option>Metro Card</option>
      <option>Route query</option><option>Refund request</option><option>Other</option>
    </select>
    <textarea class="input" id="message" aria-label="Message" placeholder="Tell us what happened. Include your PNR if it's about a trip." maxlength="2000" style="box-shadow:none;background:var(--card-2)"></textarea>
    <div id="contactMsg"></div>
    <button class="btn" id="sendBtn">Send message</button>
  </form>
  <div style="padding:4px 6px" id="legalFoot"></div>
  </div>
</main>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script>
const { $, icon, esc, api } = MG;
MG.shell("profile");

const FAQS = [
  ["Is MetriGo an official Delhi Metro app?", "No. MetriGo is a student project and isn't affiliated with DMRC. Its tickets aren't valid for travel, payments are simulated, and train times, positions and crowding come from a simulation."],
  ["How do I book a ticket?", "Pick a destination on Home or open Book a trip. Choose From and To, a date, a time and the number of tickets, then pick a train, choose seats and pay. Your QR ticket appears under Trips."],
  ["How is the route chosen?", "MetriGo runs Dijkstra's shortest-path algorithm over the metro network, so you always get the shortest route, including the best interchange such as Rajiv Chowk."],
  ["Why does the fare change with time?", "Early morning ×0.8, afternoon ×0.9, night ×1.0, morning peak ×1.3 and evening peak ×1.4. Off-peak is cheaper and less crowded."],
  ["What does Best seats do?", "It seats your group together: first it looks for adjacent free seats in one row, then searches nearby rows for the tightest group."],
  ["Which payment methods work?", "UPI, card, net banking or your Metro Card, all in test mode: no real money moves. The Metro Card gives 10% off every trip."],
  ["How do I cancel a trip?", "Open the trip under Trips and tap Cancel trip before departure. The full amount goes back to your Metro Card. See the refund policy for details."],
  ["How do I delete my account?", "Profile → Delete account. You'll need your password. Your profile and history are removed straight away; see the privacy policy for what's kept."],
  ["Is the live map real?", "Positions and arrival times follow MetriGo's timetable — every 3 minutes at peak, every 5 otherwise, 6 AM to 11 PM. They're simulated, not GPS."],
  ["Why is the first coach for women?", "As on Delhi Metro, the first coach of every train is reserved for women."],
];

function paintFaqs() {
  const term = $("#q").value.toLowerCase().trim();
  const list = FAQS.filter(([a, b]) => !term || (a + " " + b).toLowerCase().includes(term));
  $("#faqs").innerHTML = list.length
    ? list.map(([q, a]) => `<details class="faq"><summary>${esc(q)}${icon("plus")}</summary><p>${esc(a)}</p></details>`).join("")
    : `<div class="card empty">${icon("search")}<div class="h3">No matches</div><p class="small">Try another word, or send us a message.</p></div>`;
}
paintFaqs();
$("#legalFoot").innerHTML = MG.legalLinks();
$("#q").addEventListener("input", paintFaqs);
$("#faqSearch").addEventListener("submit", e => e.preventDefault());

$("#contact").addEventListener("submit", async e => {
  e.preventDefault();
  const message = $("#message").value.trim();
  const note = (t, k) => $("#contactMsg").innerHTML = `<div class="notice ${k}">${icon(k === "ok" ? "check" : "info")}<span>${esc(t)}</span></div>`;
  if (message.length < 10) return note("Please write a little more so we can help.", "bad");
  const btn = $("#sendBtn");
  MG.setBusy(btn, true, "Sending…");
  const r = await api("/support", { body: { topic: $("#topic").value, message } }).catch(err => ({ message: err.message }));
  MG.setBusy(btn, false);
  if (!r.success) return note(r.message || "Couldn't send your message.", "bad");
  $("#message").value = "";
  note(`Thanks. Your message is saved as ticket ${r.ticket}.`, "ok");
});
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
