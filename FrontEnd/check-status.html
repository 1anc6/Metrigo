<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trips · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide trips">
  <header class="page-head">
    <h1 class="title" id="title">Upcoming Trips</h1>
    <span class="spacer"></span>
    <a class="icon-btn desk-hide" href="bookings.html" aria-label="Book a trip"><span data-icon="plus"></span></a>
  </header>

  <!-- Search + filter: stacked on phones, one aligned row on desktop -->
  <div class="toolbar">
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="q" placeholder="Search…" aria-label="Search trips by station or PNR" spellcheck="false">
      <button aria-label="Search"><span data-icon="search"></span></button>
    </form>
  
    <div class="seg" id="tabs" role="group" aria-label="Trips">
      <button type="button" data-tab="upcoming" aria-pressed="true"><span data-icon="calendar"></span>Upcoming</button>
      <button type="button" data-tab="past" aria-pressed="false"><span data-icon="clock"></span>Past</button>
      <button type="button" data-tab="cancelled" aria-pressed="false"><span data-icon="x"></span>Cancelled</button>
    </div>
  </div>

  <section class="stack" id="list" aria-live="polite">
    <div class="skeleton" style="height:190px"></div><div class="skeleton" style="height:190px"></div>
  </section>
</main>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/payment.js"></script>
<script>
const { $, $$, icon, esc, api, rupee } = MG;
MG.shell("trips");

const TITLES = { upcoming: "Upcoming Trips", past: "Past Trips", cancelled: "Cancelled Trips" };
let tab = MG.params.get("tab") in TITLES ? MG.params.get("tab") : "upcoming";
let bookings = [], query = "", offline = false;

async function load() {
  const r = await api("/my-bookings").catch(e => ({ message: e.message, failed: true }));
  // No signal: fall back to the tickets saved on the last successful load
  if (r.failed) {
    const saved = await MG.tickets.all();
    if (saved.length) { bookings = saved; offline = true; paint(); return; }
  }
  if (!r.success) { $("#list").innerHTML = `<div class="card empty">${icon("info")}<div class="h3">Couldn't load trips</div><p class="small">${esc(r.message || "")}</p></div>`; return; }
  bookings = r.bookings;
  offline = false;
  paint();
}

function bucket(b) {
  const s = MG.bookingState(b);
  return s === "cancelled" ? "cancelled" : s === "completed" ? "past" : "upcoming";
}

function card(b, i) {
  const seats = (b.seats || [b.seat]).filter(Boolean);
  const date = b.travelDate ? MG.fmtDate(b.travelDate) : new Date(b.bookedAt).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
  return `
  <button class="card trip rise ${MG.bookingState(b)}" data-pnr="${esc(b.pnr)}" style="animation-delay:${i * 40}ms">
    <div class="trip-date">${esc(date)}</div>
    <div class="trip-times">
      <span>${icon("clock")}${esc(b.departTime || "—")}</span>
      ${b.line ? `<span><span class="line-dot ${b.line}"></span>${esc(b.trainId)}</span>` : `<span class="num">${esc(b.pnr)}</span>`}
      <span>${icon("clock")}${esc(b.arriveTime || "—")}</span>
    </div>
    ${MG.curveSVG(b.pnr)}
    <div class="trip-ends">
      <div><div class="name">${esc(b.from)}</div><div class="meta">${icon("seat")}${seats.length > 1 ? seats.length + " seats" : "Seat " + esc(seats[0] || "—")}</div></div>
      <div class="arrow">${icon("arrowR")}</div>
      <div class="to"><div class="name">${esc(b.to)}</div><div class="meta">${icon("ticket")}${rupee(b.price)}</div></div>
    </div>
  </button>`;
}

function paint() {
  $("#title").textContent = TITLES[tab];
  $$("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  const q = query.trim().toLowerCase();
  const list = bookings.filter(b => bucket(b) === tab && (!q || [b.from, b.to, b.pnr].some(v => String(v).toLowerCase().includes(q))));
  if (tab === "upcoming") list.sort((a, b) => a.departAt - b.departAt);
  $("#list").innerHTML = (offline ? MG.offlineNotice() : "") + (list.length ? list.map(card).join("") : `
    <div class="card empty">
      ${icon(tab === "upcoming" ? "ticket" : "clock")}
      <div class="h3">${q ? "No trips match" : tab === "upcoming" ? "No upcoming trips" : tab === "past" ? "No past trips yet" : "Nothing cancelled"}</div>
      <p class="small" style="margin-bottom:${tab === "upcoming" && !q ? 16 : 0}px">${q ? "Press search to look up any PNR." : tab === "upcoming" ? "Your QR tickets will appear here." : "Trips you take will show up here."}</p>
      ${tab === "upcoming" && !q ? `<a class="btn auto sm" href="bookings.html">${icon("plus")}Book a trip</a>` : ""}
    </div>`);
  $$("#list [data-pnr]").forEach(el => el.addEventListener("click", () =>
    MG.showTicket(bookings.find(x => x.pnr === el.dataset.pnr), { offline, onCancelled: load })));
}

$$("#tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; paint(); }));
$("#q").addEventListener("input", () => { query = $("#q").value; paint(); });

// Submitting a PNR looks it up even if it isn't yours
$("#searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pnr = $("#q").value.trim().toUpperCase();
  if (!/^MG\d{8}$/.test(pnr)) return MG.toast("Enter a PNR like MG30099800 to check its status.", "bad");
  const mine = bookings.find(b => b.pnr === pnr);
  if (mine) return MG.showTicket(mine, { offline, onCancelled: load });
  if (offline) return MG.toast("You're offline. Only saved tickets can be shown.", "bad");
  const r = await api(`/check-pnr?pnr=${encodeURIComponent(pnr)}`).catch(() => ({}));
  if (!r.success) return MG.toast("No booking found for " + pnr, "bad");
  MG.showTicket(r.booking, { allowCancel: false });
});

if (MG.params.get("pnr")) { $("#q").value = MG.params.get("pnr"); $("#searchForm").requestSubmit(); }
load();
window.addEventListener("online", () => { if (offline) load(); });
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
