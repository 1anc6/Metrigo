<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a trip · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>
<main class="app wide book">
<!-- Step 1: plan -->
<section class="col" id="planView">
  <header class="page-head">
    <a class="back" href="index.html" aria-label="Back"><span data-icon="arrowL"></span></a>
    <h1 class="title">Book a trip</h1>
    <span class="spacer"></span>
    <button class="icon-btn plain" id="swap" aria-label="Swap From and To"><span data-icon="swap"></span></button>
  </header>

  <div class="fields">
    <div class="field"><span data-icon="navigation"></span><label for="from">From</label>
      <input id="from" list="stations" placeholder="Choose station" autocomplete="off"></div>
    <div class="field"><span data-icon="pin"></span><label for="to">To</label>
      <input id="to" list="stations" placeholder="Choose station" autocomplete="off"></div>
  </div>

  <div class="seg" id="partSeg" role="group" aria-label="Part of day">
    <button type="button" data-part="morning" aria-pressed="false"><span data-icon="sun"></span>Morning</button>
    <button type="button" data-part="afternoon" aria-pressed="false"><span data-icon="clock"></span>Afternoon</button>
    <button type="button" data-part="evening" aria-pressed="false"><span data-icon="moon"></span>Evening</button>
  </div>

  <div class="card calendar" id="calendar"></div>

  <button class="row-card" id="timeRow" type="button">
    <span class="lbl"><span data-icon="clock"></span>Time</span>
    <span class="val" id="timeVal">Next train</span>
  </button>

  <div class="row-card">
    <span class="lbl"><span data-icon="ticket"></span>No. of Tickets</span>
    <div class="stepper">
      <button type="button" id="minus" aria-label="Fewer tickets"><span data-icon="minus"></span></button>
      <output id="count" aria-live="polite">1</output>
      <button type="button" id="plus" aria-label="More tickets"><span data-icon="plus"></span></button>
    </div>
  </div>

  <button class="btn" id="findBtn" type="button">Find trains</button>
</section>

<!-- Step 2: trains -->
<section class="col" id="trainView" hidden>
  <header class="page-head">
    <button class="back desk-hide" id="backToPlan" aria-label="Back"><span data-icon="arrowL"></span></button>
    <h1 class="title">Choose a train</h1>
  </header>
  <div id="results" class="stack" aria-live="polite">
    <div class="card empty"><span data-icon="train"></span><div class="h3">Pick your stations</div><p class="small">Choose From, To and a date, then find trains. Fares, crowd levels and seats show up here.</p></div>
  </div>
</section>
</main>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/payment.js"></script>
<script>
const { $, $$, icon, esc, api, rupee } = MG;
MG.shell(null);
MG.stationDatalist("stations");

const SLOTS = MetroSim.TIME_SLOTS, PARTS = MetroSim.DAY_PARTS;
const today = MetroSim.istParts(Date.now()).date;
const maxDate = new Date(Date.parse(today) + 30 * 86400000).toISOString().slice(0, 10);
const state = {
  from: MG.matchStation(MG.params.get("from")) || "",
  to: MG.matchStation(MG.params.get("to")) || "",
  date: today, slot: "", count: 1, month: today.slice(0, 7), journey: null,
};
$("#from").value = state.from;
$("#to").value = state.to;

$("#swap").addEventListener("click", () => {
  const f = $("#from"), t = $("#to");
  [f.value, t.value] = [t.value, f.value];
});

// ---------- Morning / Afternoon / Evening + precise time slot ----------
function partOf(slot) {
  if (PARTS[slot]) return slot;
  const s = SLOTS[slot];
  if (!s) return "";
  return s.start < 660 ? "morning" : s.start < 1020 ? "afternoon" : "evening";
}
function paintTime() {
  const part = partOf(state.slot);
  $$("#partSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.part === part)));
  const s = SLOTS[state.slot] || PARTS[state.slot];
  $("#timeVal").textContent = !s ? "Next train"
    : SLOTS[state.slot] ? `${s.range} · ×${s.multiplier}`
    : `${MetroSim.fmtTime(s.start)} – ${MetroSim.fmtTime(s.end)}`;
}
$$("#partSeg button").forEach(b => b.addEventListener("click", () => {
  state.slot = partOf(state.slot) === b.dataset.part ? "" : b.dataset.part;
  paintTime();
}));
$("#timeRow").addEventListener("click", () => {
  const opts = [["", "Next train", "Earliest departures from now", null], ...Object.entries(SLOTS).map(([k, s]) => [k, s.label, s.range, s.multiplier])];
  const sheet = MG.sheet.open(`
    <div class="sheet-head"><div class="h2">Time of travel</div>${MG.closeBtn()}</div>
    <div class="stack" style="gap:8px">${opts.map(([k, label, range, mult]) => `
      <button class="row-card" data-slot="${k}" style="${state.slot === k ? "box-shadow:inset 0 0 0 1.5px var(--ink)" : ""}">
        <span><span class="strong" style="display:block">${label}</span><span class="small muted">${range}</span></span>
        ${mult ? `<span class="chip ${mult < 1 ? "ok" : mult > 1 ? "warn" : ""}">×${mult} fare</span>` : ""}
      </button>`).join("")}</div>
    <p class="tiny faint" style="margin-top:12px">Peak hours cost more and trains are busier. Early mornings are 20% cheaper.</p>`, { label: "Time of travel", noFocus: true });
  $$("[data-slot]", sheet).forEach(b => b.addEventListener("click", () => { state.slot = b.dataset.slot; paintTime(); MG.sheet.close(); }));
});
paintTime();

// ---------- Calendar ----------
function paintCalendar() {
  const [y, m] = state.month.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = first.getUTCDay(); // Sunday first, like the reference
  const label = first.toLocaleDateString("en-IN", { month: "long", timeZone: "UTC" });
  let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="dow">${d}</div>`).join("");
  cells += "<div></div>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const iso = `${state.month}-${String(d).padStart(2, "0")}`;
    const off = iso < today || iso > maxDate;
    cells += `<button type="button" data-date="${iso}" ${off ? "disabled" : ""} class="${iso === today ? "today" : ""}" aria-pressed="${iso === state.date}">${String(d).padStart(2, "0")}</button>`;
  }
  $("#calendar").innerHTML = `
    <div class="cal-head">
      <button type="button" id="prevM" ${state.month > today.slice(0, 7) ? "" : "disabled"} aria-label="Previous month">${icon("chevL")}</button>
      <div class="h3">${label}</div>
      <button type="button" id="nextM" ${state.month < maxDate.slice(0, 7) ? "" : "disabled"} aria-label="Next month">${icon("chevR")}</button>
    </div>
    <div class="cal-grid">${cells}</div>`;
  $$("#calendar [data-date]").forEach(b => b.addEventListener("click", () => { state.date = b.dataset.date; paintCalendar(); }));
  $("#prevM").addEventListener("click", () => shiftMonth(-1));
  $("#nextM").addEventListener("click", () => shiftMonth(1));
}
function shiftMonth(n) {
  const [y, m] = state.month.split("-").map(Number);
  state.month = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7);
  paintCalendar();
}
paintCalendar();

// ---------- Tickets ----------
function paintCount() {
  $("#count").textContent = state.count;
  $("#minus").disabled = state.count <= 1;
  $("#plus").disabled = state.count >= 6;
}
$("#minus").addEventListener("click", () => { state.count--; paintCount(); });
$("#plus").addEventListener("click", () => { state.count++; paintCount(); });
paintCount();

// ---------- Views ----------
// Phones step between the two views; desktop shows both side by side
function showView(name) {
  $("#planView").hidden = !MG.desk.matches && name !== "plan";
  $("#trainView").hidden = name !== "trains" && !MG.desk.matches;
  if (!MG.desk.matches) window.scrollTo(0, 0);
}
MG.desk.addEventListener("change", () => showView(state.journey ? "trains" : "plan"));
$("#backToPlan").addEventListener("click", () => showView("plan"));

$("#findBtn").addEventListener("click", search);

async function search() {
  const from = MG.matchStation($("#from").value), to = MG.matchStation($("#to").value);
  if (!from || !to) return MG.toast("Pick both stations from the list.", "bad");
  if (from === to) return MG.toast("From and To are the same station.", "bad");
  $("#from").value = state.from = from;
  $("#to").value = state.to = to;
  showView("trains");
  $("#results").innerHTML = `<div class="skeleton" style="height:190px"></div><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div>`;
  try {
    const r = await api("/journey", { body: { from, to, date: state.date, slot: state.slot || null } });
    if (!r.success) { $("#results").innerHTML = empty("info", "Can't plan that trip", r.message); return; }
    state.journey = r;
    paintResults();
  } catch (err) {
    $("#results").innerHTML = empty("info", "Something went wrong", err.message);
  }
}

function empty(ic, title, text) {
  return `<div class="card empty">${icon(ic)}<div class="h3">${esc(title)}</div><p class="small">${esc(text || "")}</p></div>`;
}
function crowdChip(c) {
  return `<span class="chip ${c === "Low" ? "ok" : c === "Medium" ? "warn" : "bad"}">${icon("users")}${c}</span>`;
}

function paintResults() {
  const { route, departures, date } = state.journey;
  const legs = departures[0] ? departures[0].legs : MetroSim.legsForPath(route.path);
  $("#results").innerHTML = `
    <section class="card pad">
      <div class="row between" style="margin-bottom:12px;align-items:flex-start">
        <div style="min-width:0"><div class="eyebrow">${esc(MG.fmtDate(date, { weekday: "short", day: "numeric", month: "short" }))} · ${state.count} ticket${state.count > 1 ? "s" : ""}</div>
          <div class="h2">${esc(route.from)} → ${esc(route.to)}</div></div>
      </div>
      <div class="stats" style="margin-bottom:14px">
        <div class="stat"><div class="k">Stops</div><div class="v">${route.stops}</div></div>
        <div class="stat"><div class="k">Distance</div><div class="v">${route.distance}<small> km</small></div></div>
        <div class="stat"><div class="k">Fare</div><div class="v">${rupee(route.fare)}</div></div>
      </div>
      ${MG.timelineHTML(route.path, legs, true)}
    </section>
    <div class="section-label"><span class="h3">${departures.length ? departures.length + " trains" : "No trains"}</span><span class="small muted">${state.slot ? esc((SLOTS[state.slot] || PARTS[state.slot]).label) : "From now"}</span></div>
    ${departures.length ? departures.map((d, i) => `
      <button class="dep rise" data-i="${i}" style="animation-delay:${i * 30}ms">
        <div class="times"><span>${esc(d.departTime)}</span><span class="line"></span><span>${esc(d.arriveTime)}</span></div>
        <div class="foot">
          <div class="meta">
            <span class="chip"><span class="line-dot ${d.line}"></span>${esc(d.trainId)}</span>
            <span class="chip">${icon("clock")}${d.durationMin} min</span>
            ${crowdChip(d.crowd)}
            ${d.legs.length > 1 ? `<span class="chip">${icon("route")}via ${esc(d.legs[1].from)}</span>` : ""}
          </div>
          <div class="price"><b>${rupee(d.perPassenger * state.count)}</b><small>${rupee(d.perPassenger)} × ${state.count}</small></div>
        </div>
      </button>`).join("")
    : empty("clock", "No trains in this window", "Try another time or date. Trains run 6:00 AM – 11:00 PM.")}`;
  $$("#results .dep").forEach(b => b.addEventListener("click", () => openSeats(departures[+b.dataset.i])));
}

// ---------- Seats ----------
async function openSeats(dep) {
  const body = { from: state.from, to: state.to, date: state.journey.date, trainId: dep.trainId };
  const r = await api("/seat-map", { body }).catch(e => ({ message: e.message }));
  if (!r.success) return MG.toast(r.message || "Couldn't load seats.", "bad");

  const taken = new Set(r.taken);
  let coach = r.coaches.find(c => !c.womenOnly).id;
  let picked = [], suggested = [];

  const sheet = MG.sheet.open(`
    <div class="sheet-head">
      <div><div class="eyebrow">${esc(dep.trainId)} · ${esc(dep.departTime)}</div><div class="h2">Select ${state.count} seat${state.count > 1 ? "s" : ""}</div></div>
      ${MG.closeBtn()}
    </div>
    <div class="stack">
      <div class="seg sm" id="coachSeg" role="group" aria-label="Coach"></div>
      <div class="seat-legend"><span><i class="lg-free"></i>Free</span><span><i class="lg-taken"></i>Taken</span><span><i class="lg-mine"></i>Yours</span><span><i class="lg-sug"></i>Suggested</span></div>
      <div id="coachNote"></div>
      <div class="card pad">
        <div class="coach-front" style="margin-bottom:10px">Driver's end</div>
        <div class="seat-grid" id="seatGrid"></div>
      </div>
      <div class="row between"><span class="small muted" id="pickedLabel"></span><span class="strong num" id="pickedPrice"></span></div>
      <div class="row">
        <button class="btn ghost" id="suggestBtn" style="flex:1">${icon("bolt")}Best seats</button>
        <button class="btn" id="payBtn" style="flex:1.3" disabled></button>
      </div>
    </div>`, { label: "Seat selection", noFocus: true });

  function paint() {
    $("#coachSeg", sheet).innerHTML = r.coaches.map(c => {
      const n = picked.filter(s => s.startsWith(c.id + "-")).length;
      return `<button type="button" data-c="${c.id}" aria-pressed="${c.id === coach}">${c.id}${c.womenOnly ? " · Women" : ""}${n ? ` (${n})` : ""}</button>`;
    }).join("");
    $$("#coachSeg button", sheet).forEach(b => b.addEventListener("click", () => { coach = b.dataset.c; paint(); }));
    $("#coachNote", sheet).innerHTML = r.coaches.find(c => c.id === coach).womenOnly
      ? `<div class="notice">${icon("info")}<span>The first coach is reserved for women, as on Delhi Metro.</span></div>` : "";

    let html = `<div></div>${r.cols.slice(0, 2).map(c => `<div class="cn">${c}</div>`).join("")}<div></div>${r.cols.slice(2).map(c => `<div class="cn">${c}</div>`).join("")}`;
    for (let row = 1; row <= r.rows; row++) {
      html += `<div class="rn">${row}</div>`;
      r.cols.forEach((c, i) => {
        if (i === 2) html += "<div></div>";
        const id = `${coach}-${row}${c}`;
        const t = taken.has(id);
        html += `<button class="seat ${suggested.includes(id) ? "suggested" : ""}" data-s="${id}" ${t ? "disabled" : ""} aria-pressed="${picked.includes(id)}" aria-label="Seat ${row}${c}${t ? ", taken" : ""}">${row}${c}</button>`;
      });
    }
    $("#seatGrid", sheet).innerHTML = html;
    $$("#seatGrid .seat", sheet).forEach(b => b.addEventListener("click", () => toggle(b.dataset.s)));
    $("#pickedLabel", sheet).textContent = picked.length ? `Seats ${picked.join(", ")}` : `Choose ${state.count} seat${state.count > 1 ? "s" : ""}`;
    $("#pickedPrice", sheet).textContent = rupee(dep.perPassenger * state.count);
    const ready = picked.length === state.count;
    $("#payBtn", sheet).disabled = !ready;
    $("#payBtn", sheet).innerHTML = ready ? `Pay ${rupee(dep.perPassenger * state.count)}` : `Select ${state.count - picked.length} more`;
  }

  function toggle(id) {
    if (picked.includes(id)) picked = picked.filter(s => s !== id);
    else { picked.push(id); if (picked.length > state.count) picked.shift(); }
    suggested = [];
    paint();
  }

  $("#suggestBtn", sheet).addEventListener("click", async () => {
    const s = await api("/suggest-seats", { body: { ...body, count: state.count } }).catch(() => null);
    if (!s || !s.success) return MG.toast("No seats together right now.", "bad");
    suggested = s.suggested;
    picked = [...s.suggested];
    coach = picked[0].split("-")[0];
    paint();
  });

  $("#payBtn", sheet).addEventListener("click", () => MG.checkout({
    order: { purpose: "ticket", ...body, seats: picked },
    onSuccess: res => MG.showTicket(res.booking, { fresh: true, onClose: () => { location.href = "check-status.html"; } }),
    onError: o => { if (o.taken) search(); },
  }));

  paint();
}

if (state.from && state.to && (MG.params.get("go") === "1" || MG.desk.matches)) search();
</script>
</body>
</html>
