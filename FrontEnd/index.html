<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide home">
  <header class="top" style="align-items:flex-start">
    <div>
      <p class="hi" id="hello">Hi there,</p>
      <h1 class="title-xl">Where to?</h1>
    </div>
    <button class="icon-btn desk-hide" data-theme-toggle></button>
  </header>

  <!-- Search + filter: stacked on phones, one aligned row on desktop -->
  <div class="toolbar">
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="q" list="stations" placeholder="Search..." aria-label="Search a destination station">
      <button aria-label="Search"><span data-icon="search"></span></button>
    </form>
  
    <div class="seg" id="lineSeg" role="group" aria-label="Filter by line">
      <button type="button" data-line="" aria-pressed="true"><span data-icon="train"></span>All</button>
      <button type="button" data-line="yellow" aria-pressed="false"><span class="dot" style="background:var(--yellow)"></span>Yellow</button>
      <button type="button" data-line="blue" aria-pressed="false"><span class="dot" style="background:var(--blue)"></span>Blue</button>
    </div>
  </div>

  <div id="install" hidden></div>

  <section class="stack" id="cards" aria-live="polite">
    <div class="skeleton" style="height:212px"></div>
    <div class="skeleton" style="height:212px"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script>
const { $, $$, icon, esc, api, rupee } = MG;
MG.shell("home");
MG.stationDatalist("stations");

const ROUTES = [
  ["Rajiv Chowk", "Hauz Khas"], ["Kashmere Gate", "Vaishali"], ["Dwarka", "Karol Bagh"],
  ["New Delhi", "HUDA City Centre"], ["Samaypur Badli", "Saket"], ["Janakpuri West", "Mandi House"],
  ["AIIMS", "Chandni Chowk"], ["Rajouri Garden", "Laxmi Nagar"],
];

let me = null, routes = [], line = "", query = "";

MG.me().then(u => {
  me = u;
  if (u) $("#hello").textContent = `Hi, ${MG.displayName(u)}`;
  paint();
});

// Routes never change, so they are fetched once and kept: Home paints instantly
const ROUTES_KEY = "mg-routes-v1";
function useRoutes(list) {
  routes = list.map(r => {
    const legs = MetroSim.legsForPath(r.path) || [];
    const dep = MetroSim.departures(r.path, 540, 1440, 1)[0];
    return { ...r, lines: [...new Set(legs.map(l => l.line))], minutes: dep ? dep.durationMin : null };
  });
  paint();
}
let savedRoutes = null;
try { savedRoutes = JSON.parse(localStorage.getItem(ROUTES_KEY)); } catch (e) { /* storage blocked */ }
if (Array.isArray(savedRoutes) && savedRoutes.length === ROUTES.length) {
  queueMicrotask(() => useRoutes(savedRoutes)); // after the rest of this script sets up
} else {
  Promise.all(ROUTES.map(([from, to]) => api("/shortest-path", { body: { from, to } }).catch(() => null)))
    .then(list => {
      const ok = list.filter(r => r && r.success);
      if (ok.length === ROUTES.length) { try { localStorage.setItem(ROUTES_KEY, JSON.stringify(ok)); } catch (e) { /* storage blocked */ } }
      useRoutes(ok);
    });
}

// Lazy-create the grayscale maps as cards scroll into view
const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting || e.target._map) return;
  const r = routes.find(x => x.to === e.target.dataset.to && x.from === e.target.dataset.from);
  if (r) e.target._map = MG.miniMap(e.target, r.path);
  io.unobserve(e.target);
}), { rootMargin: "200px" });

function paint() {
  if (!routes.length) return;
  const favs = new Set((me && me.favorites) || []);
  const q = query.trim().toLowerCase();
  const list = routes.filter(r => (!line || r.lines.includes(line)) &&
    (!q || r.to.toLowerCase().includes(q) || r.from.toLowerCase().includes(q)));
  $("#cards").innerHTML = list.length ? list.map((r, i) => `
    <article class="dest rise" style="animation-delay:${i * 40}ms">
      <div class="mini-map" data-from="${esc(r.from)}" data-to="${esc(r.to)}"></div>
      <div class="d-top">
        <span class="tag">${r.lines.map(l => `<span class="line-dot ${l}"></span>`).join("")}${r.stops} stops</span>
        <span class="tag">${icon("clock")}${r.minutes ? r.minutes + " min" : "—"}</span>
      </div>
      <div class="d-bottom">
        <div style="min-width:0">
          <div class="name" title="${esc(r.to)}">${esc(r.to)}</div>
          <div class="meta">${icon("ticket")}<span>${rupee(r.fare)} · from ${esc(r.from)}</span></div>
        </div>
        <div class="actions">
          <a class="pill" href="bookings.html?from=${encodeURIComponent(r.from)}&to=${encodeURIComponent(r.to)}">Book</a>
          <button class="save" data-fav="${esc(r.to)}" aria-pressed="${favs.has(r.to)}" aria-label="Save ${esc(r.to)}">${icon("bookmark")}</button>
        </div>
      </div>
      <span class="osm">© OpenStreetMap</span>
    </article>`).join("")
    : `<div class="card empty">${icon("search")}<div class="h3">No saved routes match</div><p class="small">Press search to plan a trip to any station.</p></div>`;
  $$("#cards .mini-map").forEach(el => io.observe(el));
  $$("#cards [data-fav]").forEach(b => b.addEventListener("click", () => toggleFav(b.dataset.fav)));
}

$$("#lineSeg button").forEach(b => b.addEventListener("click", () => {
  line = b.dataset.line;
  $$("#lineSeg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  paint();
}));

$("#q").addEventListener("input", () => { query = $("#q").value; paint(); });
$("#searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const to = MG.matchStation($("#q").value);
  const from = (me && me.favorites && me.favorites[0] !== to && me.favorites[0]) || "";
  location.href = "bookings.html?" + new URLSearchParams({ from, to: to || "" });
});

// Subtle install prompt, shown when Chrome says the app is installable
function paintInstall() {
  let dismissed = false;
  try { dismissed = localStorage.getItem("mg-install-dismissed") === "1"; } catch (e) { /* storage blocked */ }
  const slot = $("#install");
  slot.hidden = !MG.install.event || dismissed;
  if (slot.hidden) return;
  slot.innerHTML = `
    <div class="install-card rise">
      <span class="ic">${icon("download")}</span>
      <div class="grow"><b>Install MetriGo</b><small>Open your tickets even with no signal</small></div>
      <button class="pill" id="installBtn">Install</button>
      <button class="icon-btn plain" id="installX" aria-label="Not now" title="Not now">${icon("x")}</button>
    </div>`;
  $("#installBtn").addEventListener("click", async () => {
    await MG.install.prompt();
    paintInstall();
  });
  $("#installX").addEventListener("click", () => {
    try { localStorage.setItem("mg-install-dismissed", "1"); } catch (e) { /* storage blocked */ }
    paintInstall();
  });
}
document.addEventListener("mg:installable", paintInstall);
document.addEventListener("mg:installed", paintInstall);
paintInstall();

async function toggleFav(name) {
  if (!me) return;
  const favs = new Set(me.favorites || []);
  favs.has(name) ? favs.delete(name) : favs.add(name);
  me.favorites = [...favs];
  const r = await api("/update-profile", { body: { favorites: me.favorites } });
  if (!r.success) return MG.toast("Couldn't save", "bad");
  MG.toast(favs.has(name) ? `${name} saved` : `${name} removed`);
  $$(`#cards [data-fav]`).forEach(b => b.setAttribute("aria-pressed", String(favs.has(b.dataset.fav))));
}
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
