<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metro Card · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide split">
  <header class="page-head">
    <a class="back" href="profile.html" aria-label="Back"><span data-icon="arrowL"></span></a>
    <h1 class="title">Metro Card</h1>
  </header>

  <div class="col sticky">
  <div class="metro-card rise">
    <span class="ring"></span><span class="ring b"></span>
    <div class="row" style="gap:8px;font-weight:800"><span data-icon="train"></span>MetriGo</div>
    <div>
      <div class="tiny" style="font-weight:700;opacity:.65;letter-spacing:.08em">BALANCE</div>
      <div class="bal" id="balance">₹—</div>
    </div>
    <div class="row between small" style="font-weight:700;opacity:.8">
      <span id="holder">—</span><span class="num" id="cardNo">•••• ••••</span>
    </div>
  </div>

  <div class="notice"><span data-icon="bolt"></span><span>Pay with your Metro Card for <b>10% off</b> every trip. Cancelled trips are refunded here.</span></div>

  </div>
  <div class="col">
  <section class="card pad stack">
    <div class="h2">Add money</div>
    <div class="amounts" id="amounts" role="group" aria-label="Amount"></div>
    <input class="input num" id="custom" inputmode="numeric" placeholder="Other amount (₹50 – ₹5,000)" aria-label="Other amount" style="box-shadow:none;background:var(--card-2)">
    <button class="btn" id="rechargeBtn">Recharge</button>
  </section>

  <section class="card pad">
    <div class="row between" style="margin-bottom:4px"><div class="h2">Activity</div><span class="small muted" id="txCount"></span></div>
    <div id="txns"></div>
  </section>
  </div>
</main>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/payment.js"></script>
<script>
const { $, $$, icon, esc, api, rupee } = MG;
MG.shell("profile");

const PRESETS = [100, 200, 500, 1000];
let amount = 200;

function paintAmounts() {
  $("#amounts").innerHTML = PRESETS.map(a => `<button type="button" data-a="${a}" aria-pressed="${a === amount}">${rupee(a)}</button>`).join("");
  $$("#amounts button").forEach(b => b.addEventListener("click", () => { amount = +b.dataset.a; $("#custom").value = ""; paintAmounts(); }));
  const ok = amount >= 50 && amount <= 5000;
  $("#rechargeBtn").disabled = !ok;
  $("#rechargeBtn").textContent = ok ? `Recharge ${rupee(amount)}` : "Enter ₹50 – ₹5,000";
}
$("#custom").addEventListener("input", () => {
  const v = parseInt($("#custom").value.replace(/\D/g, ""), 10);
  amount = Number.isFinite(v) ? v : 0;
  paintAmounts();
});
paintAmounts();

const TX = { recharge: ["plus", "Recharge"], ticket: ["ticket", "Ticket"], refund: ["refresh", "Refund"] };

async function load() {
  const [card, me] = await Promise.all([api("/card-balance"), MG.me(true)]);
  $("#balance").textContent = rupee(card.balance);
  if (me) {
    $("#holder").textContent = MG.displayName(me).toUpperCase();
    const n = Math.abs([...me.email].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) % 10000;
    $("#cardNo").textContent = "•••• " + String(n).padStart(4, "0");
  }
  const tx = card.transactions || [];
  $("#txCount").textContent = tx.length ? `${tx.length} recent` : "";
  $("#txns").innerHTML = tx.length ? tx.map(t => {
    const [ic, label] = TX[t.type] || TX.recharge;
    const when = new Date(t.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    return `<div class="txn"><span class="ic">${icon(ic)}</span>
      <div><div class="strong">${label}${t.pnr ? ` · <span class="num">${esc(t.pnr)}</span>` : ""}</div><div class="tiny faint">${esc(when)}${t.method ? " · " + esc(t.method.toUpperCase()) : ""}</div></div>
      <span class="amt ${t.amount > 0 ? "plus" : ""}">${t.amount > 0 ? "+" : "−"}${rupee(Math.abs(t.amount))}</span></div>`;
  }).join("") : `<div class="empty" style="padding:20px 0">${icon("wallet")}<div class="h3">No activity yet</div><p class="small">Recharges, card payments and refunds show up here.</p></div>`;
}

$("#rechargeBtn").addEventListener("click", () => MG.checkout({
  order: { purpose: "recharge", amount },
  onSuccess: r => { MG.sound("success"); MG.toast(`Added ${rupee(amount)} · balance ${rupee(r.balance)}`); load(); },
}));

load();
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
