<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide split">
  <header class="page-head"><h1 class="title">Your Profile</h1></header>

  <div class="col">
  <section class="card profile rise">
    <div class="ava" id="avatar">·</div>
    <div class="k">Name</div><div class="v" id="pName">—</div>
    <div class="k">Email</div><div class="v" id="pEmail">—</div>
    <div class="k">Member since</div><div class="v" id="pSince">—</div>
    <button class="btn" id="editBtn" style="margin-top:6px"><span data-icon="edit"></span>Edit Account Information</button>
  </section>

  <section class="stats raised" id="stats"></section>
  </div>
  <div class="col" style="gap:12px">

  <button class="list-row" id="savedBtn"><span data-icon="bookmark"></span><span class="grow">Saved Stations<span class="sub" id="savedSub">Quick picks for search</span></span><span data-icon="arrowR" class="go"></span></button>
  <a class="list-row" href="recharge.html"><span data-icon="wallet"></span><span class="grow">Payment Methods<span class="sub" id="cardSub">Metro Card</span></span><span data-icon="arrowR" class="go"></span></a>
  <button class="list-row" id="passBtn"><span data-icon="lock"></span><span class="grow">Change Password</span><span data-icon="arrowR" class="go"></span></button>
  <div class="list-row">
    <span data-icon="moon"></span><span class="grow">Appearance</span>
    <div class="seg sm" id="themeSeg" style="box-shadow:none;background:var(--card-2);padding:3px">
      <button type="button" data-t="light">Light</button>
      <button type="button" data-t="dark">Dark</button>
    </div>
  </div>
  <div class="list-row">
    <span data-icon="bolt"></span><span class="grow">Touch sounds<span class="sub">Soft taps and vibration</span></span>
    <div class="seg sm" id="soundSeg" style="box-shadow:none;background:var(--card-2);padding:3px">
      <button type="button" data-s="on">On</button>
      <button type="button" data-s="off">Off</button>
    </div>
  </div>
  <a class="list-row" href="help.html"><span data-icon="help"></span><span class="grow">Help &amp; Support</span><span data-icon="arrowR" class="go"></span></a>
  <a class="list-row danger" href="/logout"><span data-icon="logout"></span><span class="grow">Log Out</span></a>
  </div>
</main>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script>
const { $, $$, icon, esc, api, rupee } = MG;
MG.shell("profile");

let me = null;

async function load() {
  me = await MG.me(true);
  if (!me) return;
  $("#avatar").textContent = MG.displayName(me)[0].toUpperCase();
  $("#pName").textContent = me.name || "Add your name";
  $("#pEmail").textContent = me.email;
  $("#pSince").textContent = new Date(me.createdAt).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  $("#cardSub").textContent = `Metro Card · ${rupee(me.cardBalance)}`;
  $("#savedSub").textContent = me.favorites && me.favorites.length ? me.favorites.join(", ") : "Quick picks for search";
}

api("/my-bookings").then(r => {
  if (!r.success) return;
  const done = r.bookings.filter(b => b.status !== "Cancelled");
  const stations = new Set(done.flatMap(b => [b.from, b.to]));
  $("#stats").innerHTML = `
    <div class="stat"><div class="k">Trips</div><div class="v">${done.length}</div></div>
    <div class="stat"><div class="k">Stations</div><div class="v">${stations.size}</div></div>
    <div class="stat"><div class="k">Spent</div><div class="v">${rupee(done.reduce((s, b) => s + (b.price || 0), 0))}</div></div>`;
});

function paintTheme() { $$("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === MG.theme.get()))); }
$$("#themeSeg button").forEach(b => b.addEventListener("click", () => MG.theme.set(b.dataset.t)));
document.addEventListener("mg:theme", paintTheme);
paintTheme();

function paintSound() { $$("#soundSeg button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.s === "on") === MG.soundOn()))); }
$$("#soundSeg button").forEach(b => b.addEventListener("click", () => { MG.setSound(b.dataset.s === "on"); paintSound(); }));
paintSound();

$("#editBtn").addEventListener("click", () => {
  const sheet = MG.sheet.open(`
    <div class="sheet-head"><div class="h2">Edit account</div>${MG.closeBtn()}</div>
    <form class="stack" id="nameForm">
      <div class="input-group"><label for="nameIn">Full name</label><input class="input" id="nameIn" autocomplete="name" value="${esc(me.name || "")}"></div>
      <div class="input-group"><label>Email</label><input class="input" value="${esc(me.email)}" disabled></div>
      <button class="btn">Save changes</button>
    </form>`, { label: "Edit account" });
  $("#nameForm", sheet).addEventListener("submit", async e => {
    e.preventDefault();
    const r = await api("/update-profile", { body: { name: $("#nameIn", sheet).value } });
    if (!r.success) return MG.toast(r.message || "Update failed", "bad");
    MG.sheet.close(); MG.toast("Profile updated"); load();
  });
});

$("#passBtn").addEventListener("click", () => {
  const sheet = MG.sheet.open(`
    <div class="sheet-head"><div class="h2">Change password</div>${MG.closeBtn()}</div>
    <form class="stack" id="passForm">
      <div class="input-group"><label for="p1">New password</label><input class="input" id="p1" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div class="input-group"><label for="p2">Confirm password</label><input class="input" id="p2" type="password" autocomplete="new-password"></div>
      <div id="passMsg"></div>
      <button class="btn">Update password</button>
    </form>`, { label: "Change password" });
  $("#passForm", sheet).addEventListener("submit", async e => {
    e.preventDefault();
    const p1 = $("#p1", sheet).value, p2 = $("#p2", sheet).value;
    const msg = t => $("#passMsg", sheet).innerHTML = `<div class="notice bad">${icon("info")}<span>${esc(t)}</span></div>`;
    if (p1.length < 6) return msg("Password must be at least 6 characters.");
    if (p1 !== p2) return msg("Passwords don't match.");
    const r = await api("/update-profile", { body: { password: p1 } });
    if (!r.success) return msg(r.message || "Update failed.");
    MG.sheet.close(); MG.toast("Password updated");
  });
});

$("#savedBtn").addEventListener("click", openSaved);
function openSaved() {
  const favs = (me && me.favorites) || [];
  const sheet = MG.sheet.open(`
    <div class="sheet-head"><div class="h2">Saved stations</div>${MG.closeBtn()}</div>
    <button class="btn ghost" id="addFav" style="margin-bottom:12px">${icon("plus")}Add a station</button>
    <div class="card pad" style="padding-top:4px;padding-bottom:4px">${favs.length ? favs.map(f => `
      <div class="arrival">
        <span class="row" style="gap:3px">${MG.stationLines(f).map(l => `<span class="line-dot ${l}"></span>`).join("")}</span>
        <a class="dest-name" href="live-metro.html?station=${encodeURIComponent(f)}">${esc(f)}</a>
        <button class="icon-btn plain" style="width:34px;height:34px" data-rm="${esc(f)}" aria-label="Remove ${esc(f)}">${icon("x")}</button>
      </div>`).join("") : `<p class="small muted" style="padding:14px 0">Save stations from Home or add one here.</p>`}</div>`, { label: "Saved stations" });
  const save = async list => {
    const r = await api("/update-profile", { body: { favorites: list } });
    if (r.success) { await load(); openSaved(); }
  };
  // The picker replaces this sheet, so come back to it afterwards
  $("#addFav", sheet).addEventListener("click", async () => {
    const s = await MG.pickStation({ title: "Save a station", eyebrow: "Saved stations" });
    if (s && !favs.includes(s)) save([...favs, s]);
    else openSaved();
  });
  $$("[data-rm]", sheet).forEach(b => b.addEventListener("click", () => save(favs.filter(f => f !== b.dataset.rm))));
}

load();
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
