<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Metro · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
  .progress { height: 6px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--lc); border-radius: 6px; }
</style>
<!-- Don't paint until the tab bar and page shell exist (no pop-in during transitions) -->
<link rel="expect" href="#mg-ready" blocking="render">
<!-- Load likely next pages ahead of the tap so navigation is instant -->
<script type="speculationrules">
{"prerender":[{"source":"document","where":{"and":[{"href_matches":"/*.html"},{"not":{"href_matches":"/login.html"}}]},"eagerness":"moderate"}],
 "prefetch":[{"source":"document","where":{"selector_matches":".tabbar a"},"eagerness":"eager"}]}
</script>
</head>
<body>
<main class="app wide split live">
  <header class="page-head">
    <h1 class="title">Live Metro</h1>
    <span class="spacer"></span>
    <span class="chip" style="height:30px"><span class="live-dot"></span><span id="clock" class="num">—</span></span>
  </header>

  <div class="col sticky">
  <section class="map-card">
    <div id="map" class="map"></div>
    <div class="map-tags"><span class="tag" id="count">— trains</span></div>
  </section>
  </div>

  <div class="col">
  <div class="seg" id="lineSeg" role="group" aria-label="Filter lines">
    <button type="button" data-line="" aria-pressed="true"><span data-icon="train"></span>All</button>
    <button type="button" data-line="yellow" aria-pressed="false"><span class="dot" style="background:var(--yellow)"></span>Yellow</button>
    <button type="button" data-line="blue" aria-pressed="false"><span class="dot" style="background:var(--blue)"></span>Blue</button>
  </div>

  <section class="card pad" id="trainCard" hidden></section>

  <form class="search" id="stationForm" role="search" autocomplete="off">
    <input id="stationInput" list="stations" placeholder="Search a station..." aria-label="Station">
    <button aria-label="Show arrivals"><span data-icon="search"></span></button>
  </form>

  <section class="card pad" style="padding-bottom:8px">
    <div class="row between">
      <div><div class="eyebrow">Arriving at</div><div class="h2" id="stationName">Rajiv Chowk</div></div>
      <span id="stationLines" class="row" style="gap:6px"></span>
    </div>
    <div id="arrivals" style="margin-top:4px"></div>
  </section>

  <section class="stats raised" id="service"></section>
  <p class="tiny faint" style="padding:0 4px">Simulated from MetriGo's timetable: every 3 min at peak (8–11 AM, 5–9 PM), every 5 min otherwise, 6 AM – 11 PM. Tap a station or train on the map.</p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script>
const { $, $$, icon, esc } = MG;
MG.shell("live");
MG.stationDatalist("stations");

let station = MG.matchStation(MG.params.get("station")) || "Rajiv Chowk";
let filter = null, trains = [], stationMarker = null;

const ALL = [...MetroSim.LINES.yellow.coords, ...MetroSim.LINES.blue.coords];
const map = MG.map.create("map", { scroll: false });
const layers = MG.map.network(map, { onStation: name => setStation(name) });
map.fitBounds(L.latLngBounds(ALL), { padding: [24, 24] });
const live = MG.liveTrains(map, {
  onClick: id => { live.focusId = id; live.tick(); paintTrain(true); },
  onTick: t => { trains = t; },
});

function tick() {
  live.tick();
  $("#clock").textContent = new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit" });
  $("#count").textContent = `${trains.length} trains running`;
  paintTrain(false);
  paintArrivals();
  paintService();
}

function paintTrain(pan) {
  const card = $("#trainCard");
  if (!live.focusId) { card.hidden = true; return; }
  card.hidden = false;
  const t = trains.find(x => x.id === live.focusId);
  if (!t) {
    card.innerHTML = `<div class="row between"><div class="h3">${esc(live.focusId)} finished its run</div><button class="icon-btn plain" id="unfocus" aria-label="Close">${icon("x")}</button></div>`;
  } else {
    const line = MetroSim.LINES[t.line];
    card.innerHTML = `
      <div class="row between" style="align-items:flex-start;margin-bottom:6px">
        <div><div class="eyebrow">${line.name} · following</div><div class="h2">${esc(t.id)} → ${esc(t.towards)}</div></div>
        <button class="icon-btn plain" id="unfocus" aria-label="Stop following">${icon("x")}</button>
      </div>
      <div class="arrival" style="padding-top:4px">
        <span class="bar" style="background:${line.color}"></span>
        <div><div class="dest-name">Next: ${esc(t.nextStation)}</div><div class="sub">${Math.round(t.progress * 100)}% of the route</div></div>
        <div class="eta ${t.nextInMin < 0.75 ? "now" : ""}">${MG.etaLabel(t.nextInMin)}</div>
      </div>
      <div class="progress" style="--lc:${line.color}"><i style="width:${(t.progress * 100).toFixed(1)}%"></i></div>`;
    if (pan) map.setView([t.lat, t.lng], 13);
    else map.panTo([t.lat, t.lng], { animate: true, duration: 0.9 });
  }
  $("#unfocus").addEventListener("click", () => { live.focusId = null; live.tick(); paintTrain(); });
}

function setStation(name) {
  station = name;
  $("#stationName").textContent = name;
  $("#stationLines").innerHTML = MG.stationLines(name).map(l => `<span class="chip"><span class="line-dot ${l}"></span>${MetroSim.LINES[l].name.split(" ")[0]}</span>`).join("");
  if (stationMarker) map.removeLayer(stationMarker);
  stationMarker = L.marker(MetroSim.stationIndex[name][0].coord, { icon: MG.map.endpointIcon("end"), zIndexOffset: 1000 }).addTo(map);
  paintArrivals();
}

function paintArrivals() {
  const list = MetroSim.nextArrivals(station, Date.now(), 3).filter(a => !filter || a.line === filter).slice(0, 5);
  $("#arrivals").innerHTML = list.length ? list.map(a => `
    <button class="arrival" data-train="${esc(a.trainId)}">
      <span class="bar" style="background:${MG.lineColor(a.line)}"></span>
      <div><div class="dest-name">To ${esc(a.towards)}</div><div class="sub">${esc(a.trainId)} · ${esc(a.time)}</div></div>
      <div class="eta ${a.inMin < 0.75 ? "now" : ""}">${MG.etaLabel(a.inMin)}</div>
    </button>`).join("")
    : `<div class="empty" style="padding:18px">${icon("clock")}<div class="h3">No more trains today</div><p class="small">Service resumes at 6:00 AM.</p></div>`;
  $$("#arrivals [data-train]").forEach(b => b.addEventListener("click", () => { live.focusId = b.dataset.train; live.tick(); paintTrain(true); }));
}

function paintService() {
  const min = MetroSim.istParts(Date.now()).minutes;
  const peak = (min >= 480 && min < 660) || (min >= 1020 && min < 1260);
  const n = id => trains.filter(t => t.line === id).length;
  $("#service").innerHTML = `
    <div class="stat"><div class="k">Yellow</div><div class="v">${n("yellow")}</div></div>
    <div class="stat"><div class="k">Blue</div><div class="v">${n("blue")}</div></div>
    <div class="stat"><div class="k">Every</div><div class="v">${trains.length ? (peak ? 3 : 5) + "<small> min</small>" : "—"}</div></div>`;
}

$$("#lineSeg button").forEach(b => b.addEventListener("click", () => {
  $$("#lineSeg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  filter = b.dataset.line || null;
  Object.entries(layers).forEach(([lid, layer]) => (!filter || filter === lid) ? layer.addTo(map) : map.removeLayer(layer));
  live.setFilter(filter);
  map.fitBounds(L.latLngBounds(filter ? MetroSim.LINES[filter].coords : ALL), { padding: [24, 24] });
  paintArrivals();
}));

function pickStation() {
  const s = MG.matchStation($("#stationInput").value);
  if (!s) return;
  setStation(s);
  map.setView(MetroSim.stationIndex[s][0].coord, 13);
  $("#stationInput").value = "";
  $("#stationInput").blur();
}
$("#stationInput").addEventListener("change", pickStation);
$("#stationForm").addEventListener("submit", e => { e.preventDefault(); pickStation(); });

setStation(station);
tick();
setInterval(tick, 1000);
</script>
<i id="mg-ready" hidden></i>
</body>
</html>
