<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome · MetriGo</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mg-theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E8E4">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body class="auth-body">
<div class="auth-page">
<main class="auth">
  <img src="metro.jpg" alt="">
  <div class="auth-inner">
    <div class="auth-brand">
      <span class="b"><span class="mark"><span data-icon="train"></span></span>MetriGo</span>
      <button class="icon-btn" data-theme-toggle></button>
    </div>
    <h1>Travel with comfort and safety!</h1>
    <p class="lead">Shortest routes, reserved seats and live arrivals across the Delhi Metro.</p>
    <div class="auth-cta">
      <button class="btn" id="signInBtn">Sign in</button>
      <button class="btn ghost" id="signUpBtn">Sign up</button>
    </div>
  </div>
</main>
<section class="auth-panel" id="panel" aria-live="polite"></section>
</div>

<script src="assets/js/metro-sim.js"></script>
<script src="assets/js/core.js"></script>
<script>
const { $, icon, api, esc } = MG;
MG.$$("[data-theme-toggle]").forEach(MG.theme.bind);

const next = MG.params.get("next");
const dest = next && /^[a-z-]+\.html/.test(next) ? next : "index.html";

api("/profile", { allow401: true }).then(r => { if (r.success) location.replace(dest); }).catch(() => {});

// Desktop shows the forms in the right-hand panel; phones use a bottom sheet
function present(html, opts) {
  if (!MG.desk.matches) return MG.sheet.open(html, opts);
  const panel = $("#panel");
  panel.innerHTML = `<div class="auth-panel-inner rise">${html}</div>`;
  const first = $("input", panel);
  if (first) first.focus({ preventScroll: true });
  return panel;
}

function note(el, text, kind) {
  el.innerHTML = text ? `<div class="notice ${kind || "bad"}">${icon(kind === "ok" ? "check" : "info")}<span>${esc(text)}</span></div>` : "";
}
function peek(sheet) {
  const b = $(".peek", sheet), p = $("input[type=password]", sheet) || $(".pw", sheet);
  b.innerHTML = icon("eye");
  b.addEventListener("click", () => { p.type = p.type === "password" ? "text" : "password"; });
}

// ---------- Sign in ----------
function openSignIn(prefill, flash) {
  const sheet = present(`
    <div class="sheet-head"><div><div class="eyebrow">Welcome back</div><div class="title">Sign in</div></div>${MG.closeBtn()}</div>
    <form class="auth-form" id="f" novalidate>
      <div class="input-group"><label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(prefill || "")}"></div>
      <div class="input-group"><div class="row between"><label for="password" style="font-size:13px;font-weight:700;color:var(--text-2)">Password</label><button type="button" class="link-btn" id="forgot">Forgot password?</button></div>
        <div class="input-wrap"><input class="input pw" id="password" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="peek" aria-label="Show password"></button></div></div>
      <div id="msg" aria-live="polite"></div>
      <button class="btn" id="go">Sign in</button>
      <p class="small muted" style="text-align:center">New to MetriGo? <button type="button" class="strong" id="toUp" style="color:var(--text)">Create an account</button></p>
    </form>`, { label: "Sign in" });
  peek(sheet);
  if (flash) note($("#msg", sheet), flash, "ok");
  $("#toUp", sheet).addEventListener("click", () => openSignUp());
  $("#forgot", sheet).addEventListener("click", () => openReset($("#email", sheet).value));
  $("#f", sheet).addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#email", sheet).value.trim(), password = $("#password", sheet).value;
    if (!email || !password) return note($("#msg", sheet), "Enter your email and password.");
    const btn = $("#go", sheet);
    MG.setBusy(btn, true, "Signing in…");
    const r = await api("/login", { body: { email, password }, allow401: true }).catch(err => ({ message: err.message }));
    if (r.success) return location.href = dest;
    MG.setBusy(btn, false);
    note($("#msg", sheet), r.message || "Invalid email or password.");
  });
}

// ---------- Sign up ----------
function openSignUp() {
  const sheet = present(`
    <div class="sheet-head"><div><div class="eyebrow">Get started</div><div class="title">Create account</div></div>${MG.closeBtn()}</div>
    <form class="auth-form" id="f" novalidate>
      <div class="input-group"><label for="name">Full name</label><input class="input" id="name" autocomplete="name" placeholder="Your name"></div>
      <div class="input-group"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="input-group"><label for="password">Password</label>
        <div class="input-wrap"><input class="input pw" id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"><button type="button" class="peek" aria-label="Show password"></button></div></div>
      <label class="check"><input type="checkbox" id="terms"><span>I agree to MetriGo's terms of service and privacy policy.</span></label>
      <div id="msg" aria-live="polite"></div>
      <button class="btn" id="go">Create account</button>
      <p class="small muted" style="text-align:center">Already have an account? <button type="button" class="strong" id="toIn" style="color:var(--text)">Sign in</button></p>
    </form>`, { label: "Create account" });
  peek(sheet);
  $("#toIn", sheet).addEventListener("click", () => openSignIn());
  $("#f", sheet).addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#name", sheet).value.trim(), email = $("#email", sheet).value.trim(), password = $("#password", sheet).value;
    const msg = $("#msg", sheet);
    if (!email || !password) return note(msg, "Enter your email and a password.");
    if (password.length < 6) return note(msg, "Password must be at least 6 characters.");
    if (!$("#terms", sheet).checked) return note(msg, "Please accept the terms to continue.");
    const btn = $("#go", sheet);
    MG.setBusy(btn, true, "Creating account…");
    const r = await api("/register", { body: { name, email, password }, allow401: true }).catch(err => ({ message: err.message }));
    if (r.success) return location.href = "index.html";
    MG.setBusy(btn, false);
    note(msg, r.message || "Registration failed.");
  });
}

// ---------- Reset password ----------
function openReset(prefill) {
  const sheet = present(`
    <div class="sheet-head"><div><div class="eyebrow">Forgot password</div><div class="title">Reset password</div></div>${MG.closeBtn()}</div>
    <form class="auth-form" id="f" novalidate>
      <div class="input-group"><label for="email">Email</label>
        <div class="input-wrap"><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(prefill || "")}"><button type="button" id="getCode" aria-label="Get reset code">${icon("arrowR")}</button></div></div>
      <div class="input-group"><label for="token">Reset code</label><input class="input num" id="token" autocomplete="one-time-code" placeholder="Tap the arrow above, then check your email"></div>
      <div class="input-group"><label for="pw">New password</label><input class="input" id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div id="msg" aria-live="polite"></div>
      <button class="btn">Set new password</button>
      <p class="small muted" style="text-align:center"><button type="button" class="strong" id="toIn" style="color:var(--text)">Back to sign in</button></p>
    </form>`, { label: "Reset password" });
  const msg = $("#msg", sheet);
  $("#toIn", sheet).addEventListener("click", () => openSignIn($("#email", sheet).value));
  $("#getCode", sheet).addEventListener("click", async () => {
    const email = $("#email", sheet).value.trim();
    if (!email) return note(msg, "Enter the email you signed up with.");
    const r = await api("/forgot-password", { body: { email }, allow401: true }).catch(err => ({ message: err.message }));
    if (!r.success) return note(msg, r.message || "Couldn't send a reset code.");
    note(msg, r.message || "If an account exists for this email, we've sent a reset code.", "ok");
    $("#token", sheet).focus();
  });
  $("#f", sheet).addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#email", sheet).value.trim();
    const token = $("#token", sheet).value.trim(), newPassword = $("#pw", sheet).value;
    if (!email) return note(msg, "Enter the email you signed up with.");
    if (!token || newPassword.length < 6) return note(msg, "Enter the code from your email and a password of at least 6 characters.");
    const r = await api("/reset-password", { body: { email, token, newPassword }, allow401: true }).catch(err => ({ message: err.message }));
    if (!r.success) return note(msg, r.message || "Reset failed.");
    openSignIn($("#email", sheet).value, "Password updated. Sign in with your new password.");
  });
}

$("#signInBtn").addEventListener("click", () => openSignIn());
$("#signUpBtn").addEventListener("click", openSignUp);
if (location.hash === "#signup") openSignUp();
else if (location.hash === "#signin" || next || MG.desk.matches) openSignIn();
</script>
</body>
</html>
